services:
  - type: web
    name: mapa-choco-agregados
    runtime: python
    plan: free
    rootDir: render-service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: REFRESH_SECONDS
        value: "300"
